<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etanol ou Gasolina</title>
<meta name="theme-color" content="#0f7a4a">

<style>
  /* Layout: coluna única, resultado em destaque logo após os campos. */
  :root {
    --bg: #f3f5f2;
    --card: #ffffff;
    --ink: #14211a;
    --muted: #5d6b62;
    --line: #dce3dd;
    --accent: #0f7a4a;        /* etanol / ação */
    --accent-ink: #ffffff;
    --gas: #c2410c;           /* gasolina */
    --good-bg: #e3f4ea;
    --gas-bg: #fdeadf;
    --font-display: ui-rounded, system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1511; --card: #17211b; --ink: #eaf1ec; --muted: #9aab9f; --line: #27352c;
      --accent: #3ccf84; --accent-ink: #06130c; --gas: #ff9a5c; --good-bg: #163325; --gas-bg: #3a2315;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1511; --card: #17211b; --ink: #eaf1ec; --muted: #9aab9f; --line: #27352c;
    --accent: #3ccf84; --accent-ink: #06130c; --gas: #ff9a5c; --good-bg: #163325; --gas-bg: #3a2315;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  .display { font-family: var(--font-display); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .field {
    width: 100%; background: var(--bg); color: var(--ink); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .field:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 5px; border-radius: 14px; border: 1px solid var(--line); }
  .seg button { padding: 12px 8px; border-radius: 10px; font-weight: 700; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .btn { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; background: var(--card); color: var(--ink); }
  .num { font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; transition: width .3s; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<main class="mx-auto w-full max-w-md px-4 py-5 flex flex-col gap-4">

  <header>
    <h1 class="display text-3xl font-extrabold leading-tight">Etanol ou gasolina?</h1>
  </header>

  <!-- 1. Carro -->
  <section class="card p-4 flex flex-col gap-3">
    <label for="carro" class="label">1. Seu carro</label>
    <select id="carro" class="field"></select>
    <div id="consumos" class="grid grid-cols-2 gap-2 text-sm num" style="color:var(--muted)"></div>
  </section>

  <!-- 2. Uso -->
  <section class="card p-4 flex flex-col gap-3">
    <span class="label" id="uso-label">2. Onde vai rodar mais?</span>
    <div class="seg" role="group" aria-labelledby="uso-label">
      <button type="button" id="uso-cidade" aria-pressed="true">Cidade</button>
      <button type="button" id="uso-estrada" aria-pressed="false">Estrada</button>
    </div>
  </section>

  <!-- 3. Preços -->
  <section class="card p-4 flex flex-col gap-3">
    <span class="label">3. Preço por litro (R$)</span>
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1">
        <label for="pGas" class="text-sm font-bold" style="color:var(--gas)">Gasolina</label>
        <input id="pGas" class="field" inputmode="decimal" autocomplete="off">
      </div>
      <div class="flex flex-col gap-1">
        <label for="pEta" class="text-sm font-bold" style="color:var(--accent)">Etanol</label>
        <input id="pEta" class="field" inputmode="decimal" autocomplete="off">
      </div>
    </div>
  </section>

  <!-- Resultado -->
  <section id="resultado" class="card p-4 flex flex-col gap-4" aria-live="polite"></section>

  <p class="text-xs text-center pb-2" style="color:var(--muted)">
    Cálculo: custo por km = preço do litro ÷ km/l. Consumos são valores de referência e variam com condução, carga e clima.
  </p>
</main>

<script>
/* ===== LISTA DE CARROS: adicione novos veículos aqui (valores em km/l) ===== */
const carros = [
  {
    nome: "Honda City Sedan 2026",
    gasolinaCidade: 11.5,
    gasolinaEstrada: 17.5,
    etanolCidade: 8.3,
    etanolEstrada: 11.5
  },
  {
    nome: "Corolla Cross Hybrid 2026",
    gasolinaCidade: 18.5,
    gasolinaEstrada: 14.5,
    etanolCidade: 13.0,
    etanolEstrada: 10.5
  },
  {
    nome: "Fiat 500 Cult 1.4 Flex 2012",
    gasolinaCidade: 10.0,
    gasolinaEstrada: 12.0,
    etanolCidade: 6.6,
    etanolEstrada: 7.8
  }
];
/* ========================================================================== */

const $ = (id) => document.getElementById(id);
const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const n1 = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const parsePreco = (s) => {
  const v = parseFloat(String(s).replace(/[^\d,.]/g, "").replace(",", "."));
  return isFinite(v) && v > 0 ? v : null;
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

let uso = store.get("uso") === "estrada" ? "estrada" : "cidade";

function montarLista() {
  $("carro").innerHTML = carros.map((c, i) => `<option value="${i}">${c.nome}</option>`).join("");
  const salvo = parseInt(store.get("carro"), 10);
  if (salvo >= 0 && salvo < carros.length) $("carro").value = salvo;
  $("pGas").placeholder = store.get("pGas") || "";
  $("pEta").placeholder = store.get("pEta") || "";
}

function setUso(u) {
  uso = u;
  store.set("uso", u);
  $("uso-cidade").setAttribute("aria-pressed", u === "cidade");
  $("uso-estrada").setAttribute("aria-pressed", u === "estrada");
  calcular();
}

function calcular() {
  const c = carros[$("carro").value];
  const sufixo = uso === "cidade" ? "Cidade" : "Estrada";
  const kmGas = c["gasolina" + sufixo], kmEta = c["etanol" + sufixo];
  store.set("carro", $("carro").value);

  $("consumos").innerHTML =
    `<div>Gasolina: <b>${n1(kmGas)} km/l</b> (${uso})</div>` +
    `<div>Etanol: <b>${n1(kmEta)} km/l</b> (${uso})</div>`;

  const pGas = parsePreco($("pGas").value), pEta = parsePreco($("pEta").value);
  if ($("pGas").value) store.set("pGas", $("pGas").value);
  if ($("pEta").value) store.set("pEta", $("pEta").value);
  const out = $("resultado");

  if (!pGas || !pEta) {
    out.innerHTML = `<p class="text-center py-4" style="color:var(--muted)">Informe os dois preços para ver qual compensa mais.</p>`;
    return;
  }

  const kmGasCusto = pGas / kmGas;   // R$ por km
  const kmEtaCusto = pEta / kmEta;
  const etanolVence = kmEtaCusto < kmGasCusto;
  const empate = Math.abs(kmEtaCusto - kmGasCusto) < 0.0005;
  const venc = etanolVence ? "Etanol" : "Gasolina";
  const cor = etanolVence ? "var(--accent)" : "var(--gas)";
  const bg = etanolVence ? "var(--good-bg)" : "var(--gas-bg)";
  const menor = Math.min(kmGasCusto, kmEtaCusto), maior = Math.max(kmGasCusto, kmEtaCusto);
  const econPct = (1 - menor / maior) * 100;
  const econ100 = (maior - menor) * 100;
  const econ1000 = (maior - menor) * 1000;
  const proporcao = (pEta / pGas) * 100;
  const limite = kmEta / kmGas * 100;           // % em que há empate
  const precoLimite = pGas * kmEta / kmGas;     // preço máximo do etanol

  const head = empate
    ? `<div class="rounded-2xl p-4 text-center" style="background:var(--bg)"><div class="display text-2xl font-extrabold">Empate técnico</div><div class="text-sm" style="color:var(--muted)">O custo por km é praticamente igual.</div></div>`
    : `<div class="rounded-2xl p-4 text-center" style="background:${bg}">
         <div class="label" style="color:${cor}">Vale mais a pena</div>
         <div class="display text-4xl font-extrabold" style="color:${cor}">${venc}</div>
         <div class="text-sm mt-1">Economia de <b class="num">${n1(econPct)}%</b> por km rodado</div>
       </div>`;

  const larg = (v) => Math.max(8, (v / maior) * 100);
  out.innerHTML = head + `
    <div class="flex flex-col gap-3">
      <div>
        <div class="flex justify-between text-sm"><span style="color:var(--gas)" class="font-bold">Gasolina</span><span class="num font-bold">${brl(kmGasCusto)} / km</span></div>
        <div class="bar mt-1"><i style="width:${larg(kmGasCusto)}%;background:var(--gas)"></i></div>
      </div>
      <div>
        <div class="flex justify-between text-sm"><span style="color:var(--accent)" class="font-bold">Etanol</span><span class="num font-bold">${brl(kmEtaCusto)} / km</span></div>
        <div class="bar mt-1"><i style="width:${larg(kmEtaCusto)}%;background:var(--accent)"></i></div>
      </div>
    </div>
    ${empate ? "" : `<div class="grid grid-cols-2 gap-2 text-center">
      <div class="rounded-xl p-3" style="background:var(--bg)"><div class="num display text-xl font-extrabold">${brl(econ100)}</div><div class="text-xs" style="color:var(--muted)">a cada 100 km</div></div>
      <div class="rounded-xl p-3" style="background:var(--bg)"><div class="num display text-xl font-extrabold">${brl(econ1000)}</div><div class="text-xs" style="color:var(--muted)">a cada 1.000 km</div></div>
    </div>`}
    <p class="text-sm" style="color:var(--muted)">
      Neste carro, na ${uso === "cidade" ? "cidade" : "estrada"}, o etanol compensa até <b class="num">${n1(limite)}%</b> do preço da gasolina
      (hoje: <b class="num">${n1(proporcao)}%</b>). Com a gasolina a ${brl(pGas)}, o etanol vale até <b class="num">${brl(precoLimite)}</b>.
    </p>`;
}

montarLista();
$("carro").addEventListener("change", calcular);
$("pGas").addEventListener("input", calcular);
$("pEta").addEventListener("input", calcular);
$("uso-cidade").addEventListener("click", () => setUso("cidade"));
$("uso-estrada").addEventListener("click", () => setUso("estrada"));
setUso(uso);
</script>
</body>
</html>
